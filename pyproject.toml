[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deori"
version = "0.1.0.dev1"
description = "A Python library for the Deori (Deuri) language (ISO 639-3: der)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sagar Joshi", email = "sagar@example.com" },
]
keywords = [
    "deori",
    "deuri",
    "tibeto-burman",
    "sal-languages",
    "endangered-languages",
    "computational-linguistics",
    "nlp",
    "assam",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "regex>=2023.0.0",
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-regex>=2024.0.0",
]
nlp = [
    # Optional NLP dependencies for advanced downstream tasks
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
deori = "deori.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["deori"]

[tool.hatch.build.targets.sdist]
include = [
    "/deori",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/DATA_ETHICS.md",
    "/CONTRIBUTING.md",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF001",  # Ambiguous unicode characters in strings (essential for linguistics)
    "RUF002",  # Ambiguous unicode characters in docstrings
    "RUF003",  # Ambiguous unicode characters in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
packages = ["deori", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=deori --cov-report=term-missing --doctest-modules"
filterwarnings = [
    "error",
]
